<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Digital</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Loja de Eletrônicos</h1>
    </header>
    
    <main>
        <section id="form-produto" class="form-container">
            <h2>Adicionar Novo Produto</h2>
            <form id="form-produto">
                <input type="text" id="input-titulo" placeholder="Título do produto" required>
                <input type="number" id="input-preco" placeholder="Preço" step="0.01" required>
                <button type="submit">Adicionar Produto</button>
            </form>
        </section>
        <section id="catalogo"  class="catalogo-container">
            <h2>Produtos</h2>
            <div id="catalogo"></div>
        </section>
    </main>
    <footer>
        <p>&copy; 2025 Loja de Eletrônicos</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
