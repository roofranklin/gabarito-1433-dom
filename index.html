<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <title>Contador e Formulário</title>
  <meta charset="UTF-8">
</head>
<body>
  <h1>Contador</h1>
  <p>Valor: <span id="valor-contador">0</span></p>
  <button id="btn-subtrair">-</button>
  <button id="btn-adicionar">+</button>

  <hr>

  <h1>Formulário de Validação</h1>
    <form id="meu-formulario">
        <label for="campo-nome">Nome:</label>
        <input type="text" id="campo-nome" placeholder="Digite seu nome">
        <br><br>
        <button type="submit" id="btn-enviar">Enviar</button>
    </form>
    <p id="feedback-msg"></p>  

  <script src="script.js"></script>
</body>
</html>
